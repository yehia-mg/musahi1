# ---- Font ----
font_family      Maple Mono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ---- Cursor ----
cursor_shape     beam
cursor_blink_interval 0.5

# ---- Scrollback ----
scrollback_lines 10000

# ---- Window ----
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# ---- Transparency & blur ----
# The blur itself comes from Hyprland's layerrule; this just sets the
# base transparency level so the blur underneath is visible.
background_opacity 0.85
dynamic_background_opacity yes

# ---- Tab bar ----
tab_bar_edge     bottom
tab_bar_style    powerline
tab_powerline_style slanted

# ---- Vagabond color palette ----
background            #101511
foreground             #F2EAD3
cursor                 #A8B58A
cursor_text_color      #101511

selection_background   #4E6B47
selection_foreground   #F2EAD3

url_color               #7D8C69

# Tabs
active_tab_background   #4E6B47
active_tab_foreground   #F2EAD3
inactive_tab_background #1C2A1E
inactive_tab_foreground #C7BEA7

# Normal colors (0-7)
color0  #1C2A1E
color1  #A8654F
color2  #7D8C69
color3  #B5A15A
color4  #5B7A8C
color5  #8C6F8A
color6  #6FA894
color7  #C7BEA7

# Bright colors (8-15)
color8  #4E5C4A
color9  #C97F6A
color10 #A8B58A
color11 #D4C078
color12 #7BA0B8
color13 #A98CA6
color14 #8FC4AC
color15 #F2EAD3

# ---- Misc ----
enable_audio_bell no
update_check_interval 0
