# Session identity (helps xdg-desktop-portal-hyprland pick the right backend)
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Qt / GTK — no nwg-look, so these must be exact.
# qt6ct handles Qt theming, Kvantum is the Qt style engine.
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_BACKEND,wayland,x11

# Toolkit-native Wayland
env = MOZ_ENABLE_WAYLAND,1
env = CLUTTER_BACKEND,wayland

# Cursor (Breeze, set here since we're not using a GUI theming tool)
env = XCURSOR_THEME,Breeze
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Breeze
env = HYPRCURSOR_SIZE,24
