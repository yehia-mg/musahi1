# Tell systemd & dbus that a graphical session has started.
# Without this, graphical-session.target stays inactive under a raw
# GDM-launched Hyprland session (no session manager like uwsm), and
# anything that depends on it (xdg-desktop-portal, swaync.service, etc.)
# fails with "Dependency failed".
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start hyprland-session.target

# Wallpaper (hyprpaper config comes in a later phase; safe to start empty)
exec-once = hyprpaper
exec-once = ~/Projects/musahi1/scripts/launch-clock.sh
exec-once = ~/Projects/musahi1/scripts/launch-cava.sh

# Bar, notifications, idle handling
exec-once = waybar
exec-once = hypridle

# Clipboard history
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Tray applet for network
exec-once = nm-applet --indicator

# GTK settings applied without a GUI tool (no nwg-look) — set via gsettings
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Breeze'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

# NOTE: no polkit agent is currently in your installed package list.
# Without one, GUI apps that need privilege escalation (some NetworkManager
# actions, disk operations, etc.) will fail silently under a Hyprland session.
# Fedora ships one at /usr/libexec/polkit-gnome-authentication-agent-1 if
# polkit-gnome is installed, or use hyprpolkitagent. Add whichever you install:
# exec-once = /usr/libexec/polkit-gnome-authentication-agent-1

# UI font consistency (Qt apps use qt6ct's "general" font; this matches it for GTK)
exec-once = gsettings set org.gnome.desktop.interface font-name 'Noto Sans 10'
