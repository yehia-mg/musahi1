# Floating utility windows
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float, class:^(swappy)$

# Dolphin file-open dialogs should float and be centered
windowrule = float, title:^(Open File)$
windowrule = center, title:^(Open File)$

# No blur/shadow on the lock screen tool itself if launched as a window
windowrule = noblur, class:^(hyprlock)$

# Pin swaync's control center panel
windowrule = float, class:^(swaync-control-center)$

# Kitty transparency/blur
windowrule = opacity 0.9 0.85, class:^(kitty)$

# Default size + centering for ANY window when it becomes floating
# (applies regardless of app — kitty, firefox, anything toggled via SUPER+V or middle-click)
windowrulev2 = size 55% 55%, floating:1
windowrulev2 = center, floating:1
