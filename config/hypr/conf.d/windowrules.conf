windowrule = float 1, match:class ^(pavucontrol)$
windowrule = float 1, match:class ^(nm-connection-editor)$
windowrule = float 1, match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float 1, match:class ^(swappy)$
windowrule = float 1, match:title ^(Open File)$
windowrule = center 1, match:title ^(Open File)$
windowrule = no_blur 1, match:class ^(hyprlock)$
windowrule = float 1, match:class ^(swaync-control-center)$

# Cava audio visualizer widget
windowrule = float 1, match:class ^(cava-widget)$
windowrule = no_blur 1, match:class ^(cava-widget)$

# Standalone draggable clock widget — fully transparent, no chrome
windowrule = float 1, match:class ^(clock-widget)$
windowrule = no_blur 1, match:class ^(clock-widget)$
windowrule = opacity 1.0 1.0, match:class ^(clock-widget)$

# Fixed position + size for desktop widgets (persists across restarts)
windowrule = size 263 281, match:class ^(clock-widget)$
windowrule = move 33 74, match:class ^(clock-widget)$
windowrule = size 420 200, match:class ^(cava-widget)$
windowrule = move 27 382, match:class ^(cava-widget)$
