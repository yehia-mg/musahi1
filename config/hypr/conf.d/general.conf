# Colors are hardcoded to the Vagabond palette for now.
# Phase 10 (theme system) will replace these with sourced variables
# so themes can be swapped without touching this file.

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2

    col.active_border = rgba(4E6B47ee) rgba(7D8C69ee) 45deg
    col.inactive_border = rgba(1C2A1Eaa)

    resize_on_border = true
    allow_tearing = false

    layout = dwindle
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}
