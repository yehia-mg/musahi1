# Colors are hardcoded to the Vagabond palette for now.
# Phase 10 (theme system) will replace these with sourced variables
# so themes can be swapped without touching this file.

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2

    col.active_border = $primary $secondary 45deg
    col.inactive_border = $surface

    resize_on_border = true
    allow_tearing = false

    layout = dwindle
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

# Mouse-driven resize/move refinements
input {
    focus_on_close = 1
}

general {
    extend_border_grab_area = 18
    hover_icon_on_border = true
}
