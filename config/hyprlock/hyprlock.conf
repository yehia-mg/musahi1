background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.2
    vibrancy_darkness = 0.3
}

general {
    grace = 0
    hide_cursor = false
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = true
}

# ---- Time ----
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(242, 234, 211, 0.95)
    font_size = 90
    font_family = Maple Mono NF
    position = 0, 160
    halign = center
    valign = center
}

# ---- Date ----
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(199, 190, 167, 0.85)
    font_size = 20
    font_family = Maple Mono NF
    position = 0, 90
    halign = center
    valign = center
}

# ---- Greeting ----
label {
    monitor =
    text = Welcome back, $USER
    color = rgba(168, 181, 138, 0.9)
    font_size = 16
    font_family = Maple Mono NF
    position = 0, -180
    halign = center
    valign = center
}

# ---- Password field ----
input-field {
    monitor =
    size = 260, 55
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    rounding = 20

    outer_color = rgba(125, 140, 105, 0.6)
    inner_color = rgba(28, 42, 30, 0.65)
    font_color = rgba(242, 234, 211, 0.95)

    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <i>Password...</i>

    check_color = rgba(168, 181, 138, 1.0)
    fail_color = rgba(193, 92, 92, 1.0)
    fail_text = <i>Wrong password</i>

    position = 0, -80
    halign = center
    valign = center
}
